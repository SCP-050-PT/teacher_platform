<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ориентиры уроков — Платформа</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/header-modern.css">
  <link rel="stylesheet" href="../assets/css/header-modern.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
  <div class="app-container">
    <header class="main-header header-modern">
      <a href="index.html" class="logo">
        <img src="../assets/images/Logo_main_RGB.png" alt="Школа №777">
        <div class="logo-text-block">
          <span class="school-name">Школа №777</span>
          <span class="platform-name">Профиль педагога</span>
        </div>
      </a>
    
      <nav class="main-nav">
        <a href="index.html" class="nav-link" data-nav="index">
          <i class="fas fa-home"></i> Главная
        </a>
        <a href="orientir-uroka.html" class="nav-link" data-nav="orientir">
          <i class="fas fa-clipboard-check"></i> Ориентир урока
        </a>
        <a href="orientir-list.html" class="nav-link" data-nav="orientir-list">
          <i class="fas fa-list"></i> Список ОУ
        </a>
        <a href="ipr.html" class="nav-link" data-nav="ipr">
          <i class="fas fa-file-alt"></i> ИПР
        </a>
        <a href="ipr-list.html" class="nav-link" data-nav="ipr-list">
          <i class="fas fa-list"></i> Список ИПР
        </a>
      </nav>
    
      <div class="user-menu" id="userMenu">
        <button type="button" class="user-chip" id="userChip" aria-haspopup="true" aria-expanded="false">
          <span class="user-avatar" id="userAvatar">A</span>
          <span class="user-meta">
            <span class="user-name" id="userName">Пользователь</span>
            <span class="user-role" id="userRole">—</span>
          </span>
          <i class="fas fa-chevron-down chevron"></i>
        </button>
        <div class="user-dropdown" id="userDropdown" role="menu">
          <a href="admin-panel.html" class="admin-only" id="navAdmin" style="display: none;">
            <i class="fas fa-cog"></i> Админ-панель
          </a>
          <a href="settings.html">
            <i class="fas fa-user-cog"></i> Настройки
          </a>
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-danger" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Выйти
          </button>
        </div>
      </div>
    </header>
    <main class="main-content">
      <div class="card">
        <h3><i class="fas fa-list"></i> Заполненные ориентиры уроков</h3>
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>ФИО</th>
                <th>Предмет</th>
                <th>Класс</th>
                <th>Дата</th>
                <th>Балл</th>
                <th>%</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="listBody">
              <tr>
                <td colspan="8">Загрузка...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script>
    async function load() {
      try {
        const res = await fetch('/api/orientir');
        const data = await res.json();
        const tbody = document.getElementById('listBody');
        if (!data.length) { tbody.innerHTML = '<tr><td colspan="8">Нет записей</td></tr>'; return; }
        tbody.innerHTML = data.map(r => `
      <tr>
        <td>${r.id}</td>
        <td>${r.fio || '—'}</td>
        <td>${r.predmet || '—'}</td>
        <td>${r.class_name || '—'}</td>
        <td>${r.visit_date ? r.visit_date.slice(0, 10) : '—'}</td>
        <td>${r.score}/${r.max_score}</td>
        <td>${r.percentage}%</td>
        <td style="white-space:nowrap">
          <a href="orientir-view.html?id=${r.id}" class="btn btn-sm btn-secondary">Открыть</a>
          <a href="orientir-uroka.html?edit=${r.id}" class="btn btn-sm btn-secondary">Изменить</a>
          <button class="btn btn-sm btn-danger" onclick="del(${r.id})">Удалить</button>
        </td>
      </tr>`).join('');
      } catch (e) { document.getElementById('listBody').innerHTML = '<tr><td colspan="8">Ошибка загрузки</td></tr>'; }
    }
    async function del(id) {
      if (!confirm('Удалить запись #' + id + '?')) return;
      await fetch('/api/orientir/' + id, { method: 'DELETE' });
      load();
    }
    function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); location.href = 'login.html'; }
    load();
  </script>
  <script src="../assets/js/auth-ui.js"></script>
  <script src="../assets/js/header-modern.js"></script>
</body>

</html>
