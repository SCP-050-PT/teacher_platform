<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ориентиры уроков — Платформа</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
  <div class="app-container">
    <header class="main-header">
      <div class="logo" style="display:flex;align-items:center;gap:12px;">
        <img src="../assets/images/Logo_main_RGB.png" alt="Школа №777"
          style="height:40px;background:#fff;padding:4px;border-radius:8px;">
        <span class="school-name">Школа №777</span>
      </div>
      <nav class="main-nav">
        <a href="index.html" class="nav-link active">
          <i class="fas fa-home"></i> Главная
        </a>
        <a href="admin-panel.html" class="nav-link admin-only" id="navAdmin" style="display: none;">
          <i class="fas fa-cog"></i> Админ
        </a>
        <a href="orientir-uroka.html" class="nav-link">
          <i class="fas fa-clipboard-check"></i> Ориентир урока
        </a>
        <a href="orientir-list.html" class="nav-link">
          <i class="fas fa-list"></i> Список ОУ
        </a>
        <a href="ipr.html" class="nav-link">
          <i class="fas fa-file-alt"></i> ИПР
        </a>
        <a href="ipr-list.html" class="nav-link">
          <i class="fas fa-list"></i> Список ИПР
        </a>
      </nav>
      <div class="user-menu">
        <span id="userName"></span>
        <button onclick="logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </header>
    <main class="main-content">
      <div class="card">
        <h3><i class="fas fa-list"></i> Заполненные ориентиры уроков</h3>
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>ФИО</th>
                <th>Предмет</th>
                <th>Класс</th>
                <th>Дата</th>
                <th>Балл</th>
                <th>%</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="listBody">
              <tr>
                <td colspan="8">Загрузка...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script>
    async function load() {
      try {
        const res = await fetch('/api/orientir');
        const data = await res.json();
        const tbody = document.getElementById('listBody');
        if (!data.length) { tbody.innerHTML = '<tr><td colspan="8">Нет записей</td></tr>'; return; }
        tbody.innerHTML = data.map(r => `
      <tr>
        <td>${r.id}</td>
        <td>${r.fio || '—'}</td>
        <td>${r.predmet || '—'}</td>
        <td>${r.class_name || '—'}</td>
        <td>${r.visit_date ? r.visit_date.slice(0, 10) : '—'}</td>
        <td>${r.score}/${r.max_score}</td>
        <td>${r.percentage}%</td>
        <td style="white-space:nowrap">
          <a href="orientir-view.html?id=${r.id}" class="btn btn-sm btn-secondary">Открыть</a>
          <a href="orientir-uroka.html?edit=${r.id}" class="btn btn-sm btn-secondary">Изменить</a>
          <button class="btn btn-sm btn-danger" onclick="del(${r.id})">Удалить</button>
        </td>
      </tr>`).join('');
      } catch (e) { document.getElementById('listBody').innerHTML = '<tr><td colspan="8">Ошибка загрузки</td></tr>'; }
    }
    async function del(id) {
      if (!confirm('Удалить запись #' + id + '?')) return;
      await fetch('/api/orientir/' + id, { method: 'DELETE' });
      load();
    }
    function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); location.href = 'login.html'; }
    load();
  </script>
</body>

</html>
