<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Просмотр ориентира</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/ipr-orientir.css">
    <link rel="stylesheet" href="../assets/css/header-modern.css">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="main-header header-modern">
            <a href="index.html" class="logo">
                <img src="../assets/images/Logo_main_RGB.png" alt="Школа №777">
                <div class="logo-text-block">
                    <span class="school-name">Школа №777</span>
                    <span class="platform-name">Профиль педагога</span>
                </div>
            </a>
        
            <nav class="main-nav">
                <a href="index.html" class="nav-link" data-nav="index">
                    <i class="fas fa-home"></i> Главная
                </a>
                <a href="orientir-uroka.html" class="nav-link" data-nav="orientir">
                    <i class="fas fa-clipboard-check"></i> Ориентир урока
                </a>
                <a href="orientir-list.html" class="nav-link" data-nav="orientir-list">
                    <i class="fas fa-list"></i> Список ОУ
                </a>
                <a href="ipr.html" class="nav-link" data-nav="ipr">
                    <i class="fas fa-file-alt"></i> ИПР
                </a>
                <a href="ipr-list.html" class="nav-link" data-nav="ipr-list">
                    <i class="fas fa-list"></i> Список ИПР
                </a>
            </nav>
        
            <div class="user-menu" id="userMenu">
                <button type="button" class="user-chip" id="userChip" aria-haspopup="true" aria-expanded="false">
                    <span class="user-avatar" id="userAvatar">A</span>
                    <span class="user-meta">
                        <span class="user-name" id="userName">Пользователь</span>
                        <span class="user-role" id="userRole">—</span>
                    </span>
                    <i class="fas fa-chevron-down chevron"></i>
                </button>
                <div class="user-dropdown" id="userDropdown" role="menu">
                    <a href="admin-panel.html" class="admin-only" id="navAdmin" style="display: none;">
                        <i class="fas fa-cog"></i> Админ-панель
                    </a>
                    <a href="settings.html">
                        <i class="fas fa-user-cog"></i> Настройки
                    </a>
                    <div class="dropdown-divider"></div>
                    <button type="button" class="dropdown-danger" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Выйти
                    </button>
                </div>
            </div>
        </header>
        <main class="main-content">
            <div class="card" id="content">Загрузка...</div>
            <div style="margin-top:20px">
                <button class="btn btn-primary" onclick="window.print()">Печать / PDF</button>
                <a href="orientir-list.html" class="btn btn-secondary">Назад</a>
            </div>
        </main>
    </div>
    <script>
        async function load() {
                const id = new URLSearchParams(location.search).get('id');
                if (!id) return;
                const res = await fetch('/api/orientir/' + id);
                const d = await res.json();
                let html = `
    <h3>Ориентир урока #${d.id}</h3>
    <p><b>ФИО:</b> ${d.fio || '—'}</p>
    <p><b>Предмет:</b> ${d.predmet || '—'}</p>
    <p><b>Класс:</b> ${d.class_name || '—'}</p>
    <p><b>Дата:</b> ${d.visit_date ? d.visit_date.slice(0, 10) : '—'}</p>
    <p><b>Цель:</b> ${d.goal || '—'}</p>
    <p><b>Балл:</b> ${d.score}/${d.max_score} (${d.percentage}%)</p>
    <h4>Рекомендации</h4>
    <p>${d.recommendations || '—'}</p>
  `;
                if (d.data) {
                    const data = typeof d.data === 'string' ? JSON.parse(d.data) : d.data;
                    if (data.stages) {
                        html += '<div class="section-title">Этапы урока</div>';
                        Object.keys(data.stages).forEach(name => {
                            const v = data.stages[name];
                            html += `<div class="crit-row"><span>${name}</span><span class="val val-${v}">${v === 1 ? '1' : '0'}</span></div>`;
                        });
                    }
                    const CRIT_NAMES = {
                        "predmet": "Предметные компетенции",
                        "method": "Методические компетенции",
                        "forms": "Формы работы",
                        "tasks": "Типы заданий",
                        "ocen": "Оценивание и рефлексия",
                        "lichn": "Личностные компетенции",
                        "vovl": "Вовлечённость учеников"
                    };
                    if (data.crit) {
                        html += '<div class="section-title">Критерии</div>';
                        Object.keys(data.crit).forEach(k => {
                            const v = data.crit[k];
                            const [sec, idx] = k.split(":");
                            const label = (CRIT_NAMES[sec] || sec) + " — пункт " + (parseInt(idx) + 1);
                            html += `<div class="crit-row"><span>${label}</span><span class="val val-${v}">${v === 1 ? '1' : '0'}</span></div>`;
                        });
                    }
                }
                document.getElementById('content').innerHTML = html;
            }
            load();
    </script>
    <script src="../assets/js/auth-ui.js"></script>
    <script src="../assets/js/header-modern.js"></script>
</body>

</html>
