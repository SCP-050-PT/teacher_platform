<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Список ИПР — Платформа</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="main-header">
            <div class="logo" style="display:flex;align-items:center;gap:12px;">
                <img src="../assets/images/Logo_main_RGB.png"
                    style="height:40px;background:#fff;padding:4px;border-radius:8px;">
                <span class="school-name">Школа №777</span>
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link active">
                    <i class="fas fa-home"></i> Главная
                </a>
                <a href="admin-panel.html" class="nav-link admin-only" id="navAdmin" style="display: none;">
                    <i class="fas fa-cog"></i> Админ
                </a>
                <a href="orientir-uroka.html" class="nav-link">
                    <i class="fas fa-clipboard-check"></i> Ориентир урока
                </a>
                <a href="orientir-list.html" class="nav-link">
                    <i class="fas fa-list"></i> Список ОУ
                </a>
                <a href="ipr.html" class="nav-link">
                    <i class="fas fa-file-alt"></i> ИПР
                </a>
                <a href="ipr-list.html" class="nav-link">
                    <i class="fas fa-list"></i> Список ИПР
                </a>
            </nav>
            <div class="user-menu">
                <span id="userName"></span>
                <button onclick="logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>
        <main class="main-content">
            <div class="card">
                <h3><i class="fas fa-list"></i> Индивидуальные планы развития</h3>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>ФИО</th>
                                <th>Предмет</th>
                                <th>Период</th>
                                <th>Дата</th>
                                <th>Статус</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="listBody">
                            <tr>
                                <td colspan="6">Загрузка...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script>
        async function load() {
            const res = await fetch("/api/ipr");
            const data = await res.json();
            const tbody = document.getElementById("listBody");
            if (!data.length) { tbody.innerHTML = "<tr><td colspan=6>Нет записей</td></tr>"; return; }
            tbody.innerHTML = data.map(r => {
                let statusHtml = '';
                if (r.data) {
                    const data = typeof r.data === 'string' ? JSON.parse(r.data) : r.data;
                    let done = 0, overdue = 0, total = 0;
                    Object.values(data).forEach(arr => {
                        if (Array.isArray(arr)) arr.forEach(item => {
                            total++;
                            if (item[3] === 'done') done++;
                            else if (item[3] === 'overdue') overdue++;
                        });
                    });
                    if (total) statusHtml = `<span style="color:#10b981">${done}</span>/<span style="color:#ef4444">${overdue}</span>/<span style="color:#94a3b8">${total}</span>`;
                }
                return `
    <tr>
      <td>${r.id}</td>
      <td>${r.fio || "—"}</td>
      <td>${r.subject || "—"}</td>
      <td>${r.period || "—"}</td>
      <td>${r.created_at ? r.created_at.slice(0, 10) : "—"}</td>
      <td>${statusHtml}</td>
      <td>
        <a href="ipr.html?edit=${r.id}" class="btn btn-sm btn-secondary">Изменить</a>
        <button class="btn btn-sm btn-danger" onclick="del(${r.id})">Удалить</button>
      </td>
    </tr>`;
            }).join("");
        }
        async function del(id) {
            if (!confirm("Удалить ИПР #" + id + "?")) return;
            await fetch("/api/ipr/" + id, { method: "DELETE" });
            load();
        }
        function logout() { localStorage.removeItem("token"); location.href = "login.html"; }
        load();
    </script>
</body>

</html>
