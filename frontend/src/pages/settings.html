<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки | Профиль педагога</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/header-modern.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/images/Logo_main_RGB.png">
    <style>
        .settings-wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        .settings-wrap h1 {
            font-size: 1.5rem;
            margin: 0 0 8px;
            color: #1e293b;
        }

        .settings-wrap .lead {
            color: #64748b;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .settings-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 22px 22px 18px;
            margin-bottom: 18px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        }

        .settings-card h2 {
            font-size: 1.05rem;
            margin: 0 0 16px;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-card .form-group {
            margin-bottom: 14px;
        }

        .settings-card label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .settings-card input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .settings-card input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        .settings-card small {
            display: block;
            margin-top: 5px;
            color: #94a3b8;
            font-size: 12px;
        }

        .settings-card .btn {
            margin-top: 4px;
        }

        .msg {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }

        .msg.ok {
            display: block;
            background: #d1fae5;
            color: #065f46;
        }

        .msg.err {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header class="main-header header-modern">
            <a href="index.html" class="logo">
                <img src="../assets/images/Logo_main_RGB.png" alt="Школа №777">
                <div class="logo-text-block">
                    <span class="school-name">Школа №777</span>
                    <span class="platform-name">Профиль педагога</span>
                </div>
            </a>

            <nav class="main-nav">
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Главная</a>
                <a href="orientir-uroka.html" class="nav-link"><i class="fas fa-clipboard-check"></i> Ориентир урока</a>
                <a href="orientir-list.html" class="nav-link"><i class="fas fa-list"></i> Список ОУ</a>
                <a href="ipr.html" class="nav-link"><i class="fas fa-file-alt"></i> ИПР</a>
                <a href="ipr-list.html" class="nav-link"><i class="fas fa-list"></i> Список ИПР</a>
            </nav>

            <div class="user-menu" id="userMenu">
                <button type="button" class="user-chip" id="userChip" aria-haspopup="true" aria-expanded="false">
                    <span class="user-avatar" id="userAvatar">A</span>
                    <span class="user-meta">
                        <span class="user-name" id="userName">Пользователь</span>
                        <span class="user-role" id="userRole">—</span>
                    </span>
                    <i class="fas fa-chevron-down chevron"></i>
                </button>
                <div class="user-dropdown" id="userDropdown" role="menu">
                    <a href="admin-panel.html" class="admin-only" id="navAdmin" style="display: none;">
                        <i class="fas fa-cog"></i> Админ-панель
                    </a>
                    <a href="settings.html">
                        <i class="fas fa-user-cog"></i> Настройки
                    </a>
                    <div class="dropdown-divider"></div>
                    <button type="button" class="dropdown-danger" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Выйти
                    </button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="settings-wrap">
                <!-- ФИО -->
                <div class="settings-card">
                    <h2><i class="fas fa-id-card" style="color:#7c3aed"></i> Профиль</h2>
                    <form id="formFullName">
                        <div class="form-group">
                            <label>ФИО</label>
                            <input type="text" id="fullNameInput" placeholder="Фамилия Имя Отчество" required>
                            <small>Так вас будут видеть в правом верхнем углу</small>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Сохранить ФИО</button>
                        <div class="msg" id="msgName"></div>
                    </form>
                </div>

                <!-- Логин -->
                <div class="settings-card">
                    <h2><i class="fas fa-user-edit" style="color:#667eea"></i> Логин</h2>
                    <form id="formUsername">
                        <div class="form-group">
                            <label>Текущий логин</label>
                            <input type="text" id="currentLoginDisplay" disabled>
                        </div>
                        <div class="form-group">
                            <label>Новый логин</label>
                            <input type="text" id="newUsernameInput" minlength="3" pattern="[a-zA-Z0-9_]+"
                                placeholder="latin_only">
                            <small>Только латиница, цифры и _</small>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Сменить логин</button>
                        <div class="msg" id="msgLogin"></div>
                    </form>
                </div>

                <!-- Пароль -->
                <div class="settings-card">
                    <h2><i class="fas fa-lock" style="color:#f59e0b"></i> Пароль</h2>
                    <form id="formPassword">
                        <div class="form-group">
                            <label>Текущий пароль</label>
                            <input type="password" id="oldPassword" required autocomplete="current-password">
                        </div>
                        <div class="form-group">
                            <label>Новый пароль (мин. 6 символов)</label>
                            <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
                        </div>
                        <div class="form-group">
                            <label>Повтор нового пароля</label>
                            <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-key"></i> Сменить пароль</button>
                        <div class="msg" id="msgPass"></div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) location.href = 'login.html';

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            location.href = 'login.html';
        }

        async function api(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token,
                    ...(options.headers || {})
                }
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || data.message || 'Ошибка запроса');
            return data;
        }

        function showMsg(id, text, ok) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = 'msg ' + (ok ? 'ok' : 'err');
        }

        function patchLocalUser(patch) {
            let user = {};
            try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch (e) { }
            Object.assign(user, patch);
            localStorage.setItem('user', JSON.stringify(user));
            // обновить шапку
            if (typeof fillUserChip === 'function') fillUserChip();
            else {
                const name = user.fullName || user.full_name || user.username || 'Пользователь';
                const n = document.getElementById('userName');
                const a = document.getElementById('userAvatar');
                if (n) n.textContent = name;
                if (a) {
                    const p = name.trim().split(/\s+/);
                    a.textContent = p.length > 1 ? (p[0][0] + p[1][0]).toUpperCase() : name.slice(0, 2).toUpperCase();
                }
            }
        }

        // Загрузка профиля
        (async function loadProfile() {
            try {
                const me = await api('/api/auth/me');
                document.getElementById('fullNameInput').value = me.full_name || '';
                document.getElementById('currentLoginDisplay').value = me.username || '';
                patchLocalUser({
                    id: me.id,
                    username: me.username,
                    role: me.role,
                    fullName: me.full_name,
                    full_name: me.full_name
                });
            } catch (e) {
                console.error(e);
            }
        })();

        // ФИО
        document.getElementById('formFullName').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullNameInput').value.trim();
            if (!fullName) return showMsg('msgName', 'Укажите ФИО', false);
            try {
                await api('/api/auth/profile', {
                    method: 'PUT',
                    body: JSON.stringify({ fullName })
                });
                patchLocalUser({ fullName, full_name: fullName });
                showMsg('msgName', 'ФИО сохранено', true);
            } catch (err) {
                showMsg('msgName', err.message, false);
            }
        });

        // Логин
        document.getElementById('formUsername').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newUsername = document.getElementById('newUsernameInput').value.trim();
            if (newUsername.length < 3) return showMsg('msgLogin', 'Минимум 3 символа', false);
            try {
                const data = await api('/api/auth/change-username', {
                    method: 'PUT',
                    body: JSON.stringify({ newUsername })
                });
                if (data.token) localStorage.setItem('token', data.token);
                document.getElementById('currentLoginDisplay').value = data.newUsername || newUsername;
                document.getElementById('newUsernameInput').value = '';
                patchLocalUser({ username: data.newUsername || newUsername });
                showMsg('msgLogin', 'Логин изменён', true);
            } catch (err) {
                showMsg('msgLogin', err.message, false);
            }
        });

        // Пароль
        document.getElementById('formPassword').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (newPassword !== confirm) return showMsg('msgPass', 'Пароли не совпадают', false);
            try {
                await api('/api/auth/change-password', {
                    method: 'PUT',
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                document.getElementById('formPassword').reset();
                showMsg('msgPass', 'Пароль изменён', true);
            } catch (err) {
                showMsg('msgPass', err.message, false);
            }
        });

        // Шапка
        (function initHeaderModern() {
            function getUser() {
                try { return JSON.parse(localStorage.getItem('user') || '{}'); } catch { return {}; }
            }
            function initials(name) {
                if (!name) return '?';
                const parts = String(name).trim().split(/\s+/);
                if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            function roleLabel(role) {
                if (role === 'admin') return 'Администратор';
                if (role === 'teacher' || role === 'methodist') return 'Методист';
                return role || 'Пользователь';
            }
            window.fillUserChip = function () {
                const user = getUser();
                const name = user.fullName || user.full_name || user.username || 'Пользователь';
                const nameEl = document.getElementById('userName');
                const roleEl = document.getElementById('userRole');
                const avEl = document.getElementById('userAvatar');
                if (nameEl) nameEl.textContent = name;
                if (roleEl) roleEl.textContent = roleLabel(user.role);
                if (avEl) avEl.textContent = initials(name);
                const adminLink = document.getElementById('navAdmin');
                if (adminLink) adminLink.style.display = user.role === 'admin' ? 'flex' : 'none';
            };
            function setupDropdown() {
                const chip = document.getElementById('userChip');
                const dropdown = document.getElementById('userDropdown');
                if (!chip || !dropdown) return;
                chip.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const open = dropdown.classList.toggle('is-open');
                    chip.classList.toggle('is-open', open);
                });
                document.addEventListener('click', () => {
                    dropdown.classList.remove('is-open');
                    chip.classList.remove('is-open');
                });
                dropdown.addEventListener('click', (e) => e.stopPropagation());
            }
            fillUserChip();
            setupDropdown();
        })();
    </script>
</body>

</html>
